<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing rim -->
  <rect x="10" y="10" width="44" height="44" rx="10" fill="url(#coreGrad)" stroke="url(#chipGrad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Inner silicon die -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#09090b" stroke="url(#chipGrad)" stroke-width="1.5" />
  
  <!-- Microchip core circuits / X symbol for NextX -->
  <path d="M25 25L39 39M39 25L25 39" stroke="url(#chipGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3" fill="#06b6d4" />

  <!-- Top Pins -->
  <line x1="22" y1="4" x2="22" y2="10" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="4" x2="32" y2="10" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="4" x2="42" y2="10" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="22" y1="54" x2="22" y2="60" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="60" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="54" x2="42" y2="60" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="4" y1="22" x2="10" y2="22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="32" x2="10" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="42" x2="10" y2="42" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="54" y1="22" x2="60" y2="22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="32" x2="60" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="42" x2="60" y2="42" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
</svg>
