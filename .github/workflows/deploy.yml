name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test:run

      - name: Zero-Leak Security Scan
        run: npm run security-scan

      - name: Build Static Production Artifact
        run: npm run build

      - name: Verify CNAME Integrity
        run: |
          if [ ! -f "dist/CNAME" ]; then
            echo "Error: dist/CNAME is missing!"
            exit 1
          fi
          if [ "$(cat dist/CNAME)" != "nextx.cc" ]; then
            echo "Error: dist/CNAME does not contain nextx.cc!"
            exit 1
          fi
          echo "CNAME integrity verified: nextx.cc"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
